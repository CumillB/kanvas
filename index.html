  #lock-dots { display: flex; gap: 16px; }

  .lock-dot.filled { background: #E8A33D; border-color: #E8A33D; }
  #lock-dots.shake { animation: lockShake 0.4s ease; }
  @keyframes lockShake {
    20%, 60% { transform: translateX(-8px); }

  }
  @media (prefers-reduced-motion: reduce) { #lock-dots.shake { animation: none; } }
  #lock-error { color: #D96C6C; font-size: 12px; min-height: 16px; visibility: hidden; }

    border: 1px solid #2A3B47; color: #DCE6EC; font-size: 26px; font-family: 'Space Grotesk', sans-serif;

  #undo-toast {

    padding: 10px 8px 10px 14px; align-items: center; gap: 14px;

  #undo-toast-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #lock-cancel {
    display: none; background: none; border: none; color: #7C93A3; font-size: 13px;

  @media (orientation: landscape) and (max-height: 500px) {
    #lock-overlay { gap: 10px; padding: 10px; }
    #lock-dots { gap: 12px; }
    .lock-dot { width: 11px; height: 11px; }
    #lock-keypad { grid-template-columns: repeat(3, 50px); gap: 8px; }
    #lock-keypad button { width: 50px; height: 50px; font-size: 19px; }

  textarea:focus, button:focus-visible { outline: 2px solid #E8A33D; outline-offset: 1px; }

  .connect-btn {

  .box-code-wrap { display: flex; background: #0F1720; flex: 1; min-height: 90px; }
  .box-linenos {

  .box.connect-pending { outline: 2px solid #E8A33D; outline-offset: 2px; }
</style>

      outputEl.appendChild(e);

    var linenos = document.createElement('div');
    linenos.className = 'box-linenos';

    var textarea = document.createElement('textarea');
    textarea.className = 'box-code';
    textarea.spellcheck = false;
    textarea.value = box.code;
    textarea.rows = 4;

    function refreshLinenos() {
      var n = textarea.value.split('\n').length;
      var out = [];
      for (var i = 1; i <= n; i++) out.push(i);
      linenos.textContent = out.join('\n');
    }
    refreshLinenos();

    var codeBeforeEdit = box.code;
    textarea.addEventListener('focus', function () {
      codeBeforeEdit = box.code;
    });
    textarea.addEventListener('blur', function () {
      if (textarea.value !== codeBeforeEdit) {
        box.prevCode = codeBeforeEdit;
        undoLink.classList.add('show');
      }
    });
    textarea.addEventListener('input', function () {
      box.code = textarea.value;
      refreshLinenos();
      schedulePersist(box.id);
    });
    textarea.addEventListener('scroll', function () {
      linenos.scrollTop = textarea.scrollTop;
    });

    undoLink.addEventListener('click', function () {
      if (box.prevCode === undefined) return;
      textarea.value = box.prevCode;
      box.code = box.prevCode;
      box.prevCode = undefined;
      refreshLinenos();
      undoLink.classList.remove('show');
      schedulePersist(box.id);
    });

    codeWrap.appendChild(linenos);
    codeWrap.appendChild(textarea);

    var runBtn = document.createElement('button');
    runBtn.className = 'run-btn';
    runBtn.textContent = '\u25B6 K\u00F6r';

    var canvasArea = document.createElement('div');
    canvasArea.className = 'box-canvas';
    canvasArea.id = 'canvas-' + box.id;

    var output = document.createElement('div');
    output.className = 'box-output';
    output.id = 'output-' + box.id;

    runBtn.addEventListener('click', function () { runBox(box, output, canvasArea, el); });

    el.appendChild(header);
    el.appendChild(codeWrap);
    el.appendChild(runBtn);
    el.appendChild(canvasArea);
    el.appendChild(output);

    makeDraggable(header, box, el);

    if (box.output) {
      renderOutput(output, box.output);
    } else {
      renderOutput(output, { logs: [], hasResult: false });
    }

    return el;
  }

  function duplicateBox(box) {
    var copy = {
      id: makeId(), num: nextNum++, name: box.name ? box.name + ' (kopia)' : '',
      x: box.x + 24, y: box.y + 24, code: box.code, output: null
    };
    boxes.push(copy);
    canvasEl.appendChild(createBoxElement(copy));
    schedulePersist(copy.id);
  }

  function addBox() {
    var offset = (boxes.length % 6) * 24;
    var x = (scrollEl.scrollLeft + scrollEl.clientWidth / 2) / zoom - BOX_HALF_WIDTH + offset;
    var y = (scrollEl.scrollTop + 70) / zoom + offset;
    var box = {
      id: makeId(), num: nextNum++, name: '', x: x, y: y,
      code: '// din kod h\u00E4r\nconsole.log("hej!");',
      output: null
    };
    boxes.push(box);
    canvasEl.appendChild(createBoxElement(box));
    schedulePersist(box.id);
  }

  function init() {
    setStatus('Laddar…');
    loadState().then(function () {
      if (boxes.length === 0) {
        boxes.push({
          id: makeId(), num: 1, name: 'Exempel',
          x: CANVAS_SIZE / 2 - BOX_HALF_WIDTH, y: CANVAS_SIZE / 2 - BOX_HALF_WIDTH,
          code: 'console.log("Hej fr\u00E5n ruta 1!");\nreturn 6 * 7;',
          output: null
        });
        nextNum = 2;
      }
      boxes.forEach(function (box) {
        canvasEl.appendChild(createBoxElement(box));
      });
      renderConnections();
      requestAnimationFrame(function () {
        scrollEl.scrollLeft = CANVAS_SIZE / 2 - scrollEl.clientWidth / 2;
        scrollEl.scrollTop = CANVAS_SIZE / 2 - scrollEl.clientHeight / 2;
      });
      setStatus('');
    });
  }

  function blurActive() {
    var a = document.activeElement;
    if (a && a !== document.body && typeof a.blur === 'function') a.blur();
  }

  function findBox(idOrName) {
    if (!idOrName) return null;
    var byId = boxes.filter(function (b) { return b.id === idOrName; })[0];
    if (byId) return byId;
    var lower = String(idOrName).toLowerCase();
    return boxes.filter(function (b) { return boxDisplayName(b).toLowerCase() === lower; })[0] || null;
  }

  // A small, deliberate surface so box code (e.g. an AI-agent box) can act on
  // Kanvas itself. Boxes still run in their own isolated scope from each
  // other, but any box can reach these shared actions via window.KanvasAPI.
  window.KanvasAPI = {
    addBox: function (code, name) {
      var offset = (boxes.length % 6) * 24;
      var x = (scrollEl.scrollLeft + scrollEl.clientWidth / 2) / zoom - BOX_HALF_WIDTH + offset;
      var y = (scrollEl.scrollTop + 70) / zoom + offset;
      var box = { id: makeId(), num: nextNum++, name: name || '', x: x, y: y, code: code || '', output: null };
      boxes.push(box);
      canvasEl.appendChild(createBoxElement(box));
      schedulePersist(box.id);
      return box.id;
    },
    listBoxes: function () {
      return boxes.map(function (b) { return { id: b.id, name: boxDisplayName(b) }; });
    },
    getBoxCode: function (idOrName) {
      var b = findBox(idOrName);
      return b ? b.code : null;
    },
    setBoxCode: function (idOrName, code) {
      var b = findBox(idOrName);
      if (!b) return false;
      var prevCode = b.code;
      var boxId = b.id;
      b.code = code;
      var ta = document.querySelector('#box-' + b.id + ' .box-code');
      if (ta) ta.value = code;
      schedulePersist(b.id);
      showUndoToast('AI ändrade "' + boxDisplayName(b) + '"', function () {
        var target = findBox(boxId);
        if (!target) return;
        target.code = prevCode;
        var ta2 = document.querySelector('#box-' + boxId + ' .box-code');
        if (ta2) ta2.value = prevCode;
        schedulePersist(boxId);
      });
      return true;
    },
    runBoxById: function (idOrName) {
      var b = findBox(idOrName);
      if (!b) return false;
      var boxEl = document.getElementById('box-' + b.id);
      var outputEl = document.getElementById('output-' + b.id);
      var canvasAreaEl = document.getElementById('canvas-' + b.id);
      if (!boxEl || !outputEl || !canvasAreaEl) return false;
      runBox(b, outputEl, canvasAreaEl, boxEl);
      return true;
    },
    deleteBoxById: function (idOrName) {
      var b = findBox(idOrName);
      if (!b) return false;
      deleteBox(b.id);
      return true;
    },
    renameBox: function (idOrName, newName) {
      var b = findBox(idOrName);
      if (!b) return false;
      b.name = newName;
      var nameEl = document.querySelector('#box-' + b.id + ' .box-name');
      if (nameEl) nameEl.textContent = boxDisplayName(b);
      schedulePersist(b.id);
      return true;
    },
    storageGet: function (key) { return storageAdapter.get('kanvas-ext-' + key); },
    storageSet: function (key, value) { return storageAdapter.set('kanvas-ext-' + key, value); },
    storageDelete: function (key) { return storageAdapter.delete('kanvas-ext-' + key); },
    connectBoxes: function (fromIdOrName, toIdOrName) {
      var a = findBox(fromIdOrName), b = findBox(toIdOrName);
      if (!a || !b) return false;
      addConnection(a.id, b.id);
      return true;
    },
    listConnections: function () {
      return connections.map(function (c) {
        var a = findBox(c.from), b = findBox(c.to);
        return { id: c.id, from: a ? boxDisplayName(a) : null, to: b ? boxDisplayName(b) : null };
      });
    }
  };

  // ---- App lock (6-digit code) ----
  var lockOverlayEl = document.getElementById('lock-overlay');
  var lockTitleEl = document.getElementById('lock-title');
  var lockDotsEl = document.getElementById('lock-dots');
  var lockErrorEl = document.getElementById('lock-error');
  var lockKeypadEl = document.getElementById('lock-keypad');
  var lockCancelEl = document.getElementById('lock-cancel');

  async function sha256(text) {
    if (window.crypto && window.crypto.subtle) {
      var enc = new TextEncoder().encode('kanvas-lock:' + text);
      var buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    }
    return 'plain:' + text;
  }

  function lockTitleFor(state) {
    switch (state) {
      case 'setup-choose': return 'Välj en kod';
      case 'setup-confirm': return 'Bekräfta koden';
      case 'unlock': return 'Ange kod';
      case 'change-verify': return 'Ange nuvarande kod';
      case 'change-choose': return 'Välj en ny kod';
      case 'change-confirm': return 'Bekräfta den nya koden';
      default: return '';
    }
  }

  function updateDots() {
    var dots = lockDotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('filled', i < enteredDigits.length);
    }
  }

  function showLockScreen(state) {
    lockState = state;
    enteredDigits = '';
    updateDots();
    lockTitleEl.textContent = lockTitleFor(state);
    lockErrorEl.style.visibility = 'hidden';
    lockCancelEl.style.display =
      (state === 'change-verify' || state === 'change-choose' || state === 'change-confirm') ? 'block' : 'none';
    lockOverlayEl.style.display = 'flex';
  }

  function hideLockScreen() {
    lockOverlayEl.style.display = 'none';
    lockState = 'none';
  }

  function showLockError(msg) {
    lockErrorEl.textContent = msg;
    lockErrorEl.style.visibility = 'visible';
    enteredDigits = '';
    updateDots();
    lockDotsEl.classList.remove('shake');
    void lockDotsEl.offsetWidth;
    lockDotsEl.classList.add('shake');
  }

  function handleBackspace() {
    enteredDigits = enteredDigits.slice(0, -1);
    updateDots();
  }

  async function handleDigit(d) {
    if (enteredDigits.length >= LOCK_DIGITS) return;
    enteredDigits += d;
    updateDots();
    if (enteredDigits.length === LOCK_DIGITS) {
      await handleLockComplete();
    }
  }

  async function handleLockComplete() {
    var hash = await sha256(enteredDigits);
    if (lockState === 'setup-choose') {
      pendingNewPin = enteredDigits;
      showLockScreen('setup-confirm');
    } else if (lockState === 'setup-confirm') {
      if (enteredDigits === pendingNewPin) {
        pinHash = await sha256(enteredDigits);
        pendingNewPin = null;
        await storageAdapter.set('kanvas-lock-hash', pinHash);
        hideLockScreen();
      } else {
        pendingNewPin = null;
        showLockError('Koderna matchade inte');
        setTimeout(function () { showLockScreen('setup-choose'); }, 450);
      }
    } else if (lockState === 'unlock') {
      if (hash === pinHash) {
        hideLockScreen();
      } else {
        showLockError('Fel kod');
      }
    } else if (lockState === 'change-verify') {
      if (hash === pinHash) {
        showLockScreen('change-choose');
      } else {
        showLockError('Fel kod');
      }
    } else if (lockState === 'change-choose') {
      pendingNewPin = enteredDigits;
      showLockScreen('change-confirm');
    } else if (lockState === 'change-confirm') {
      if (enteredDigits === pendingNewPin) {
        pinHash = await sha256(enteredDigits);
        pendingNewPin = null;
        await storageAdapter.set('kanvas-lock-hash', pinHash);
        hideLockScreen();
      } else {
        pendingNewPin = null;
        showLockError('Koderna matchade inte');
        setTimeout(function () { showLockScreen('change-choose'); }, 450);
      }
    }
  }

  for (var lockDotI = 0; lockDotI < LOCK_DIGITS; lockDotI++) {
    var lockDotEl = document.createElement('span');
    lockDotEl.className = 'lock-dot';
    lockDotsEl.appendChild(lockDotEl);
  }

  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'].forEach(function (k) {
    if (k === '') {
      lockKeypadEl.appendChild(document.createElement('div'));
    } else if (k === 'back') {
      var backBtn = document.createElement('button');
      backBtn.setAttribute('aria-label', 'Radera');
      backBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>';
      backBtn.addEventListener('click', handleBackspace);
      lockKeypadEl.appendChild(backBtn);
    } else {
      var digitBtn = document.createElement('button');
      digitBtn.textContent = k;
      digitBtn.addEventListener('click', function () { handleDigit(k); });
      lockKeypadEl.appendChild(digitBtn);
    }
  });

  lockCancelEl.addEventListener('click', function () {
    pendingNewPin = null;
    hideLockScreen();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && pinHash && lockState === 'none') {
      document.getElementById('settings-menu').style.display = 'none';
      document.getElementById('transfer-overlay').style.display = 'none';
      if (window.eruda && typeof window.eruda.hide === 'function') {
        try { window.eruda.hide(); } catch (e) {}
      }
      showLockScreen('unlock');
    }
  });

  (async function initLock() {
    try {
      var stored = await storageAdapter.get('kanvas-lock-hash');
      pinHash = stored && stored.value ? stored.value : null;
    } catch (e) {
      pinHash = null;
    }
    showLockScreen(pinHash ? 'unlock' : 'setup-choose');
  })();

  // ---- Settings dropdown (byt kod / flytta till annan enhet) ----
  var settingsBtnEl = document.getElementById('settingsBtn');
  var settingsMenuEl = document.getElementById('settings-menu');

  settingsBtnEl.addEventListener('click', function () {
    blurActive();
    if (settingsMenuEl.style.display === 'block') {
      settingsMenuEl.style.display = 'none';
      return;
    }
    var rect = settingsBtnEl.getBoundingClientRect();
    settingsMenuEl.style.top = (rect.bottom + 6) + 'px';
    settingsMenuEl.style.left = rect.left + 'px';
    settingsMenuEl.style.display = 'block';
  });
  document.addEventListener('click', function (e) {
    if (settingsMenuEl.style.display === 'block' &&
        !settingsMenuEl.contains(e.target) && e.target !== settingsBtnEl && !settingsBtnEl.contains(e.target)) {
      settingsMenuEl.style.display = 'none';
    }
  });
  function jumpToBox() {
    if (boxes.length === 0) { alert('Inga rutor att hitta.'); return; }
    var list = boxes.map(function (b, i) { return (i + 1) + '. ' + boxDisplayName(b); }).join('\n');
    var choice = prompt('Skriv namn eller nummer på rutan:\n' + list);
    if (!choice) return;
    choice = choice.trim();
    var target = null;
    var asNum = parseInt(choice, 10);
    if (!isNaN(asNum) && String(asNum) === choice && asNum >= 1 && asNum <= boxes.length) {
      target = boxes[asNum - 1];
    } else {
      target = findBox(choice);
    }
    if (!target) { alert('Hittade ingen ruta med det namnet.'); return; }
    var cx = (target.x + BOX_HALF_WIDTH) * zoom;
    var cy = (target.y + 110) * zoom;
    scrollEl.scrollLeft = cx - scrollEl.clientWidth / 2;
    scrollEl.scrollTop = cy - scrollEl.clientHeight / 2;
    var boxEl = document.getElementById('box-' + target.id);
    if (boxEl) {
      boxEl.classList.remove('pulse');
      void boxEl.offsetWidth;
      boxEl.classList.add('pulse');
    }
  }

  document.getElementById('menuChangeCode').addEventListener('click', function () {
    settingsMenuEl.style.display = 'none';
    if (pinHash) showLockScreen('change-verify');
  });
  document.getElementById('menuFind').addEventListener('click', function () {
    settingsMenuEl.style.display = 'none';
    jumpToBox();
  });
  document.getElementById('menuTransfer').addEventListener('click', function () {
    settingsMenuEl.style.display = 'none';
    document.getElementById('transfer-export-area').value = '';
    document.getElementById('transfer-import-area').value = '';
    document.getElementById('transfer-status').textContent = '';
    document.getElementById('transfer-overlay').style.display = 'flex';
  });

  // ---- Debug console (Eruda) - off by default, toggled from settings ----
  var erudaScriptLoading = null;
  var erudaActive = false;
  var erudaInitialized = false;
  var menuDebugEl = document.getElementById('menuDebug');

  function loadErudaScript() {
    if (window.eruda) return Promise.resolve();
    if (erudaScriptLoading) return erudaScriptLoading;
    erudaScriptLoading = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('Kunde inte ladda felsökningskonsolen.')); };
      document.head.appendChild(s);
    });
    return erudaScriptLoading;
  }

  function updateDebugLabel() {
    menuDebugEl.textContent = 'Felsökningskonsol: ' + (erudaActive ? 'På' : 'Av');
  }

  async function enableEruda() {
    try {
      await loadErudaScript();
      if (!erudaInitialized) {
        window.eruda.init({ useShadowDom: true });
        erudaInitialized = true;
      }
      window.eruda.position({ x: 16, y: 66 });
      window.eruda.show();
      erudaActive = true;
    } catch (e) {
      alert('Kunde inte starta felsökningskonsolen: ' + e.message);
    }
    updateDebugLabel();
  }

  function disableEruda() {
    if (window.eruda && typeof window.eruda.hide === 'function') {
      try { window.eruda.hide(); } catch (e) {}
    }
    erudaActive = false;
    updateDebugLabel();
  }

  menuDebugEl.addEventListener('click', function () {
    settingsMenuEl.style.display = 'none';
    if (erudaActive) {
      disableEruda();
      storageAdapter.set('kanvas-debug-enabled', 'false');
    } else {
      enableEruda();
      storageAdapter.set('kanvas-debug-enabled', 'true');
    }
  });

  (async function initDebugConsole() {
    try {
      var pref = await storageAdapter.get('kanvas-debug-enabled');
      if (pref && pref.value === 'true') {
        await enableEruda();
      }
    } catch (e) { /* stays off by default */ }
  })();

  // ---- Move to another device (export/import everything Kanvas has stored) ----
  function utf8ToBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToUtf8(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  async function exportState() {
    var listResult = await storageAdapter.list('kanvas-');
    var keys = (listResult && listResult.keys) || [];
    var data = {};
    for (var i = 0; i < keys.length; i++) {
      var r = await storageAdapter.get(keys[i]);
      if (r && r.value !== undefined && r.value !== null) data[keys[i]] = r.value;
    }
    return utf8ToBase64(JSON.stringify({ v: 1, data: data }));
  }

  async function importState(code) {
    var parsed = JSON.parse(base64ToUtf8(code));
    if (!parsed || !parsed.data || typeof parsed.data !== 'object') {
      throw new Error('Ogiltig kod');
    }
    var keys = Object.keys(parsed.data);
    for (var i = 0; i < keys.length; i++) {
      await storageAdapter.set(keys[i], parsed.data[keys[i]]);
    }
  }

  document.getElementById('transfer-close').addEventListener('click', function () {
    document.getElementById('transfer-overlay').style.display = 'none';
  });

  document.getElementById('transfer-export-btn').addEventListener('click', async function () {
    var btn = this;
    var area = document.getElementById('transfer-export-area');
    btn.disabled = true;
    btn.textContent = 'Skapar...';
    try {
      area.value = await exportState();
    } catch (e) {
      area.value = '';
      document.getElementById('transfer-status').style.color = '#D96C6C';
      document.getElementById('transfer-status').textContent = 'Kunde inte skapa export.';
    }
    btn.disabled = false;
    btn.textContent = 'Skapa kod';
  });

  document.getElementById('transfer-copy-btn').addEventListener('click', function () {
    var area = document.getElementById('transfer-export-area');
    if (!area.value) return;
    area.focus();
    area.select();
    var done = function () {
      var btn = document.getElementById('transfer-copy-btn');
      var original = 'Kopiera';
      btn.textContent = 'Kopierat!';
      setTimeout(function () { btn.textContent = original; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(area.value).then(done).catch(function () {
        try { document.execCommand('copy'); done(); } catch (e) {}
      });
    } else {
      try { document.execCommand('copy'); done(); } catch (e) {}
    }
  });

  document.getElementById('transfer-import-btn').addEventListener('click', async function () {
    var btn = this;
    var code = document.getElementById('transfer-import-area').value.trim();
    var statusEl = document.getElementById('transfer-status');
    if (!code) return;
    if (!confirm('Detta skriver över allt som redan finns på den här enheten (rutor, kod, namn, kod-lås). Fortsätt?')) return;
    btn.disabled = true;
    btn.textContent = 'Importerar...';
    try {
      await importState(code);
      statusEl.style.color = '#8FBC94';
      statusEl.textContent = 'Klart, laddar om...';
      setTimeout(function () { window.location.reload(); }, 700);
    } catch (e) {
      statusEl.style.color = '#D96C6C';
      statusEl.textContent = 'Kunde inte importera - kontrollera att hela koden klistrades in.';
      btn.disabled = false;
      btn.textContent = 'Importera och ladda om';
    }
  });

  document.getElementById('connectBtn').addEventListener('click', function () {
    blurActive();
    setConnectMode(!connectMode);
  });
  document.getElementById('addBtn').addEventListener('click', function () { blurActive(); addBox(); });
  document.getElementById('zoomInBtn').addEventListener('click', function () { blurActive(); applyZoom(zoom * 1.25); });
  document.getElementById('zoomOutBtn').addEventListener('click', function () { blurActive(); applyZoom(zoom / 1.25); });
  document.getElementById('zoomLabel').addEventListener('click', function () { blurActive(); applyZoom(1); });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {
      // Not available in this context (e.g. the sandboxed Claude preview) -
      // harmless here, only matters once the file is actually hosted.
    });
  }

  init();
})();
</script>

.chat-bubble{max-width:75%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;color:#DCE6EC;word-break:break-word;}
.chat-bubble.mine{background:#4a7dfc;margin-left:auto;}
.chat-bubble.theirs{background:#1C2B36;}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #2A3B47;}
.chat-add-code-btn{margin-top:6px;padding:4px 8px;border-radius:6px;border:none;background:#48bb78;color:#fff;font-size:11px;}
.pending-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:#DCE6EC;}
</style>

<button id="chat-toggle-btn">💬</button>
<div id="chat-panel">
  <div class="chat-panel-header">
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:#DCE6EC;font-size:15px;">Vänner</span>
    <button id="chat-panel-close" style="background:none;border:none;color:#7C93A3;font-size:20px;">&times;</button>
  </div>
  <div class="chat-add-row">
    <input id="add-friend-input" placeholder="Användarnamn" />
    <button id="add-friend-btn" style="background:#E8A33D;color:#0F1720;border:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;">Lägg till</button>
  </div>
  <div id="pending-requests" style="padding:0 14px;"></div>
  <div class="chat-layout">
    <ul id="friend-list"></ul>
    <div class="chat-col">
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Skriv..." />
        <button id="chat-paste-btn" style="background:#1C2B36;border:1px solid #2A3B47;color:#DCE6EC;border-radius:8px;padding:8px 10px;">📋</button>
        <button id="chat-send-btn" style="background:#E8A33D;color:#0F1720;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;">Skicka</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var _supabase = supabase.createClient('https://atubqjjjnhfjcogbshxs.supabase.co', 'sb_publishable_iglai8z88iouTRuXiGKy1Q_KdNYkSsU');
  var FAKE_EMAIL_DOMAIN = 'kanvasapp.com';
  function usernameToEmail(u) { return u.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '') + '@' + FAKE_EMAIL_DOMAIN; }

  var authMode = 'login', friendsList = [], pendingIncoming = [], activeChatFriendId = null, messagesByFriend = {};

  async function registerUser(username, password) {
    var r = await _supabase.auth.signUp({ email: usernameToEmail(username), password: password });
    if (r.error) throw new Error(r.error.message.indexOf('already') !== -1 ? 'Användarnamnet är upptaget' : r.error.message);
    var p = await _supabase.from('profiles').insert({ id: r.data.user.id, username: username.trim() });
    if (p.error) throw new Error(p.error.code === '23505' ? 'Användarnamnet är upptaget' : p.error.message);
  }
  async function loginUser(username, password) {
    var r = await _supabase.auth.signInWithPassword({ email: usernameToEmail(username), password: password });
    if (r.error) throw new Error('Fel användarnamn eller lösenord');
  }
  async function getCurrentUser() {
    var s = await _supabase.auth.getSession();
    return s.data.session ? s.data.session.user.id : null;
  }

  document.getElementById('auth-toggle-btn').addEventListener('click', function () {
    authMode = authMode === 'login' ? 'register' : 'login';
    document.getElementById('auth-title').textContent = authMode === 'login' ? 'Logga in' : 'Registrera';
    document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'Logga in' : 'Registrera';
    this.textContent = authMode === 'login' ? 'Inget konto? Registrera dig' : 'Har redan konto? Logga in';
  });

  document.getElementById('auth-submit-btn').addEventListener('click', async function () {
    var username = document.getElementById('auth-username').value.trim();
    var password = document.getElementById('auth-password').value;
    var errorEl = document.getElementById('auth-error');
    errorEl.textContent = '';
    if (!username || !password) { errorEl.textContent = 'Fyll i båda fälten'; return; }
    try {
      if (authMode === 'register') await registerUser(username, password); else await loginUser(username, password);
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('chat-toggle-btn').style.display = 'block';
      await initFriendsAndChat();
    } catch (err) { errorEl.textContent = err.message; }
  });

  async function searchUserByUsername(u) {
    return (await _supabase.from('profiles').select('id, username').eq('username', u.trim()).maybeSingle()).data;
  }
  async function sendFriendRequestTo(targetUsername) {
    var target = await searchUserByUsername(targetUsername);
    if (!target) throw new Error('Användare finns inte');
    var me = await getCurrentUser();
    if (target.id === me) throw new Error('Kan inte lägga till dig själv');
    var r = await _supabase.from('friendships').insert({ requester_id: me, addressee_id: target.id });
    if (r.error) throw new Error(r.error.code === '23505' ? 'Förfrågan finns redan' : r.error.message);
  }
  async function respondToRequest(friendshipId, accept) {
    if (accept) await _supabase.from('friendships').update({ status: 'accepted', responded_at: new Date().toISOString() }).eq('id', friendshipId);
    else await _supabase.from('friendships').delete().eq('id', friendshipId);
  }
  async function loadFriendsAndRequests() {
    var me = await getCurrentUser();
    var rows = (await _supabase.from('friendships').select('id, requester_id, addressee_id, status').or('requester_id.eq.' + me + ',addressee_id.eq.' + me)).data || [];
    var otherIds = rows.map(function (r) { return r.requester_id === me ? r.addressee_id : r.requester_id; });
    var profiles = otherIds.length ? (await _supabase.from('profiles').select('id, username').in('id', otherIds)).data || [] : [];
    var nameById = {}; profiles.forEach(function (p) { nameById[p.id] = p.username; });
    friendsList = []; pendingIncoming = [];
    rows.forEach(function (r) {
      var otherId = r.requester_id === me ? r.addressee_id : r.requester_id;
      if (r.status === 'accepted') friendsList.push({ id: otherId, username: nameById[otherId], friendshipId: r.id, unread: false });
      else if (r.status === 'pending' && r.addressee_id === me) pendingIncoming.push({ fromUserId: otherId, fromUsername: nameById[otherId], friendshipId: r.id });
    });
  }

  function toClientMsg(row) { return { id: row.id, fromUserId: row.sender_id, to: row.recipient_id, contentType: row.type, content: row.content }; }
  async function sendMsgTo(recipientId, content, type) {
    var me = await getCurrentUser();
    var r = await _supabase.from('messages').insert({ sender_id: me, recipient_id: recipientId, content: content, type: type || 'text' });
    if (r.error) throw new Error('Kunde inte skicka (är ni vänner?)');
  }
  async function loadHistory(friendId) {
    var me = await getCurrentUser();
    var data = (await _supabase.from('messages').select('*')
      .or('and(sender_id.eq.' + me + ',recipient_id.eq.' + friendId + '),and(sender_id.eq.' + friendId + ',recipient_id.eq.' + me + ')')
      .order('created_at', { ascending: true }).limit(50)).data || [];
    await _supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('sender_id', friendId).eq('recipient_id', me).is('read_at', null);
    messagesByFriend[friendId] = data.map(toClientMsg);
  }

  function renderFriendList() {
    var el = document.getElementById('friend-list'); el.innerHTML = '';
    friendsList.forEach(function (f) {
      var li = document.createElement('li');
      if (f.id === activeChatFriendId) li.style.background = '#1C2B36';
      li.textContent = f.username + (f.unread ? ' •' : '');
      li.addEventListener('click', function () { openChat(f.id); });
      el.appendChild(li);
    });
  }
  function renderPendingRequests() {
    var el = document.getElementById('pending-requests'); el.innerHTML = '';
    pendingIncoming.forEach(function (r) {
      var div = document.createElement('div'); div.className = 'pending-row';
      var label = document.createElement('span'); label.style.flex = '1'; label.textContent = r.fromUsername + ' vill lägga till dig';
      var accept = document.createElement('button'); accept.textContent = 'OK';
      accept.style.cssText = 'background:#E8A33D;color:#0F1720;border:none;border-radius:6px;padding:4px 8px;font-size:11px;';
      accept.addEventListener('click', async function () { await respondToRequest(r.friendshipId, true); await loadFriendsAndRequests(); renderFriendList(); renderPendingRequests(); });
      var decline = document.createElement('button'); decline.textContent = '✕';
      decline.style.cssText = 'background:none;border:1px solid #2A3B47;color:#7C93A3;border-radius:6px;padding:4px 8px;font-size:11px;';
      decline.addEventListener('click', async function () { await respondToRequest(r.friendshipId, false); await loadFriendsAndRequests(); renderPendingRequests(); });
      div.append(label, accept, decline); el.appendChild(div);
    });
  }
  async function renderChatMessages(friendId) {
    var el = document.getElementById('chat-messages'); el.innerHTML = '';
    var me = await getCurrentUser();
    (messagesByFriend[friendId] || []).forEach(function (msg) {
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + (msg.fromUserId === me ? 'mine' : 'theirs');
      if (msg.contentType === 'code') {
        bubble.innerHTML = '📋 Kod delad<br>';
        var addBtn = document.createElement('button'); addBtn.className = 'chat-add-code-btn'; addBtn.textContent = 'Lägg till som ruta';
        addBtn.addEventListener('click', function () { window.KanvasAPI.addBox(msg.content, 'Från chatt'); });
        bubble.appendChild(addBtn);
      } else { bubble.textContent = msg.content; }
      el.appendChild(bubble);
    });
    el.scrollTop = el.scrollHeight;
  }
  async function openChat(friendId) {
    activeChatFriendId = friendId;
    renderFriendList();
    await loadHistory(friendId);
    await renderChatMessages(friendId);
  }

  async function handleRealtimeMessage(row) {
    var msg = toClientMsg(row);
    var me = await getCurrentUser();
    var otherId = msg.fromUserId === me ? msg.to : msg.fromUserId;
    if (!messagesByFriend[otherId]) messagesByFriend[otherId] = [];
    messagesByFriend[otherId].push(msg);
    if (activeChatFriendId === otherId) renderChatMessages(otherId);
    else { var f = friendsList.find(function (x) { return x.id === otherId; }); if (f) { f.unread = true; renderFriendList(); } }
  }
  async function handleRealtimeFriendshipChange() { await loadFriendsAndRequests(); renderFriendList(); renderPendingRequests(); }

  async function initFriendsAndChat() {
    var me = await getCurrentUser();
    if (!me) return;
    await loadFriendsAndRequests(); renderFriendList(); renderPendingRequests();
    _supabase.channel('kanvas-messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'recipient_id=eq.' + me }, function (p) { handleRealtimeMessage(p.new); }).subscribe();
    _supabase.channel('kanvas-friendships-in').on('postgres_changes', { event: '*', schema: 'public', table: 'friendships', filter: 'addressee_id=eq.' + me }, handleRealtimeFriendshipChange).subscribe();
    _supabase.channel('kanvas-friendships-out').on('postgres_changes', { event: '*', schema: 'public', table: 'friendships', filter: 'requester_id=eq.' + me }, handleRealtimeFriendshipChange).subscribe();
  }

  document.getElementById('chat-toggle-btn').addEventListener('click', function () { document.getElementById('chat-panel').style.display = 'flex'; });
  document.getElementById('chat-panel-close').addEventListener('click', function () { document.getElementById('chat-panel').style.display = 'none'; });
  document.getElementById('add-friend-btn').addEventListener('click', async function () {
    var input = document.getElementById('add-friend-input'); var username = input.value.trim(); if (!username) return;
    try { await sendFriendRequestTo(username); input.value = ''; alert('Förfrågan skickad!'); } catch (err) { alert(err.message); }
  });
  document.getElementById('chat-send-btn').addEventListener('click', async function () {
    var input = document.getElementById('chat-input'); var content = input.value.trim(); if (!content || !activeChatFriendId) return;
    try {
      await sendMsgTo(activeChatFriendId, content, 'text');
      var me = await getCurrentUser();
      if (!messagesByFriend[activeChatFriendId]) messagesByFriend[activeChatFriendId] = [];
      messagesByFriend[activeChatFriendId].push({ id: 'tmp' + Date.now(), fromUserId: me, to: activeChatFriendId, contentType: 'text', content: content });
      await renderChatMessages(activeChatFriendId);
      input.value = '';
    } catch (err) { alert(err.message); }
  });
  document.getElementById('chat-paste-btn').addEventListener('click', async function () {
    try { document.getElementById('chat-input').value += await navigator.clipboard.readText(); }
    catch (err) { alert('Kunde inte läsa urklipp – håll ner i fältet och välj Klistra in.'); }
  });

  (async function () {
    var me = await getCurrentUser();
    if (me) { document.getElementById('chat-toggle-btn').style.display = 'block'; await initFriendsAndChat(); }
    else { document.getElementById('auth-overlay').style.display = 'flex'; }
  })();
})();
</script>
</html>
